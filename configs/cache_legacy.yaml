# Synthetic schema example: replace task/stages/views with your reviewed private configuration.
# Annotated LeRobot v2 input; source is read-only and output must be new.
source: ${GRANA_LEROBOT_SOURCE}
output: ${GRANA_CACHE_OUTPUT}
episodes:
- 0
task: synthetic-token-and-lid
compressed_task_prompt: 'Synthetic example: place the blue token inside the tray,
  then close the tray lid.'
stages:
- label: '1'
  prompt: Place the blue token inside the tray.
- label: '2'
  prompt: Close the tray lid with the token inside.
views:
  top: observation.images.top
  wrist: observation.images.wrist
fps: 10
image_size:
- 320
- 240
progress:
  method: legacy_concat_quality_v1
  progress_cap_seconds: 15
  min_segment_frames: 10
  max_trailing_seconds: 0.2
